plugins {
    id 'java'
}

group = 'configswitcher'
version = '1.0.24'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

repositories {
    mavenCentral()
}

def ideaHome = System.getenv('IDEA_HOME') ?: (file('C:/Program Files/JetBrains/IntelliJ IDEA 2026.2.1').exists() ? 'C:/Program Files/JetBrains/IntelliJ IDEA 2026.2.1' : null)

dependencies {
    if (ideaHome != null && file(ideaHome).exists()) {
        compileOnly fileTree(dir: "${ideaHome}/lib", include: ['**/*.jar'])
        compileOnly fileTree(dir: "${ideaHome}/plugins/java/lib", include: ['**/*.jar'])
        compileOnly fileTree(dir: "${ideaHome}/plugins/terminal/lib", include: ['**/*.jar'])
        testImplementation fileTree(dir: "${ideaHome}/lib", include: ['**/*.jar'])
        testImplementation fileTree(dir: "${ideaHome}/plugins/java/lib", include: ['**/*.jar'])
        testImplementation fileTree(dir: "${ideaHome}/plugins/terminal/lib", include: ['**/*.jar'])
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def jbrHome = file('C:/Program Files/JetBrains/IntelliJ IDEA 2026.2.1/jbr')

test {
    useJUnitPlatform()
    if (ideaHome != null && file("${ideaHome}/lib/jna/amd64").exists()) {
        systemProperty 'jna.boot.library.path', "${ideaHome}/lib/jna/amd64"
    }
    if (jbrHome.exists()) {
        def javaExe = file("${jbrHome}/bin/java.exe").exists() ? file("${jbrHome}/bin/java.exe") : file("${jbrHome}/bin/java")
        if (javaExe.exists()) {
            executable = javaExe
        }
    }
}

jar {
    archiveBaseName.set('spring-boot-profile-switcher')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('buildChromeExtension', Zip) {
    archiveBaseName.set('chrome-mesh-extension')
    archiveVersion.set(project.version.toString())
    from('chrome-mesh-extension') {
        include 'manifest.json'
        include 'content.js'
        include 'rules.json'
        include 'README.md'
        include 'examples/**'
    }
}

tasks.register('buildPlugin', Zip) {
    dependsOn jar, 'buildChromeExtension'
    archiveBaseName.set('spring-boot-profile-switcher')
    archiveVersion.set(project.version.toString())
    into('spring-boot-profile-switcher/lib') {
        from jar.archiveFile
    }
}

tasks.register('installToRunningIde') {
    dependsOn buildPlugin
    onlyIf {
        // Run locally only (skip in CI pipelines like GitHub Actions)
        System.getenv('CI') == null && System.getenv('GITHUB_ACTIONS') == null
    }
    def pluginVersion = project.version.toString()
    def jarProvider = jar.archiveFile
    doLast {
        def appData = System.getenv('APPDATA')
        if (!appData) {
            println "[Local Install] APPDATA environment variable not found, skipping IDE plugin installation."
            return
        }

        def ideRootDirs = [new File(appData, 'JetBrains'), new File(appData, 'OpenIDE')].findAll { it.exists() }
        if (ideRootDirs.isEmpty()) {
            println "[Local Install] Neither JetBrains nor OpenIDE directory found in APPDATA, skipping."
            return
        }

        // Detect running JetBrains / OpenIDE processes
        def runningProcesses = []
        try {
            ProcessHandle.allProcesses().each { ph ->
                def cmd = ph.info().command().orElse('').toLowerCase()
                if (cmd.contains('idea64') || cmd.contains('idea.exe') || cmd.contains('webstorm') || cmd.contains('openide')) {
                    def name = cmd.substring(Math.max(0, Math.max(cmd.lastIndexOf('/'), cmd.lastIndexOf('\\')) + 1))
                    runningProcesses.add(name)
                }
            }
        } catch (Exception ignored) {}

        if (!runningProcesses.isEmpty()) {
            println "[Local Install] Detected running IDE: ${runningProcesses.unique().join(', ')}"
        } else {
            println "[Local Install] No running IDE detected; installing to installed JetBrains / OpenIDE directories."
        }

        def jarFile = jarProvider.get().asFile
        int installedCount = 0

        ideRootDirs.each { rootDir ->
            rootDir.listFiles()?.each { ideDir ->
                if (ideDir.isDirectory() && (ideDir.name.contains('Idea') || ideDir.name.contains('WebStorm') || ideDir.name.contains('PyCharm') || ideDir.name.contains('OpenIDE'))) {
                    // Remove legacy plugin directories with obsolete names
                    ['config-switcher', 'n2o-profile-switcher', 'idea-config-switcher'].each { legacyName ->
                        def legacyDir = new File(ideDir, "plugins/${legacyName}")
                        if (legacyDir.exists()) {
                            try {
                                legacyDir.deleteDir()
                                println "[Local Install] Deleted legacy plugin directory in ${ideDir.name}: ${legacyName}"
                            } catch (Exception ex) {
                                println "[Local Install] Warning: Failed to delete legacy ${legacyName} in ${ideDir.name}: ${ex.message}"
                            }
                        }
                    }

                    def pluginLib = new File(ideDir, "plugins/spring-boot-profile-switcher/lib")
                    if (pluginLib.exists() || new File(ideDir, "plugins").exists()) {
                        if (!pluginLib.exists()) {
                            pluginLib.mkdirs()
                        }
                        def destFile = new File(pluginLib, "spring-boot-profile-switcher-${pluginVersion}.jar")
                        try {
                            java.nio.file.Files.copy(jarFile.toPath(), destFile.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                            println "[Local Install] Installed to: ${ideDir.name} (${destFile.name})"
                            installedCount++
                        } catch (Exception ex) {
                            // Direct copy locked by running JVM (mapped memory section), rename outside pluginLib then copy
                            def retiredDir = new File(ideDir, "system/retired_plugins")
                            retiredDir.mkdirs()
                            def retiredFile = new File(retiredDir, "spring-boot-profile-switcher-${System.currentTimeMillis()}.jar")
                            if (destFile.renameTo(retiredFile)) {
                                java.nio.file.Files.copy(jarFile.toPath(), destFile.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                                println "[Local Install] Installed to running ${ideDir.name} via atomic rename (${destFile.name})"
                                installedCount++
                            } else {
                                println "[Local Install] Warning: Failed to replace file in ${ideDir.name}: ${ex.message}"
                            }
                        }

                        // Ensure only destFile remains in the lib directory
                        pluginLib.listFiles()?.each { f ->
                            if (f.name != destFile.name) {
                                if (!f.delete()) {
                                    def retiredDir = new File(ideDir, "system/retired_plugins")
                                    retiredDir.mkdirs()
                                    def retiredFile = new File(retiredDir, "${f.name}-${System.currentTimeMillis()}.jar")
                                    f.renameTo(retiredFile)
                                }
                            }
                        }

                        // Purge old retired switcher jar files from system/retired_plugins
                        def retiredDir = new File(ideDir, "system/retired_plugins")
                        if (retiredDir.exists()) {
                            retiredDir.listFiles()?.each { rf ->
                                if (rf.name.startsWith("config-switcher") || rf.name.startsWith("n2o-profile-switcher") || rf.name.startsWith("spring-boot-profile-switcher")) {
                                    try { rf.delete() } catch (Exception ignored) {}
                                }
                            }
                        }
                    }
                }
            }
        }

        println "[Local Install] Successfully installed plugin to ${installedCount} IDE directory(ies)."
        println "  -> Restart IDE to apply changes"
    }
}

tasks.named('buildPlugin') {
    finalizedBy('installToRunningIde')
}

tasks.named('assemble') {
    dependsOn('buildPlugin', 'buildChromeExtension')
}

tasks.register('deploy') {
    dependsOn installToRunningIde
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (jbrHome.exists() && JavaVersion.current() < JavaVersion.VERSION_25) {
        options.fork = true
        options.forkOptions.javaHome = jbrHome
    }
}
